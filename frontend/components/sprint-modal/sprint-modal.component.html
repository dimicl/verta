<div class="sprint-modal">
  <div class="sprint-modal-header">
    <span class="sprint-modal-header-text">
      {{ isEditMode ? 'Edit Sprint' : 'Add Sprint' }}
    </span>
  </div>

  <div class="sprint-modal-body">
    <div class="sprint-form-group">
      <app-input
        [label]="'Sprint name'"
        [modelValue]="sprintName.value"
        (onGetValue)="onNameInput($event)"
      />
    </div>
    <div class="sprint-form-group">
      <app-input
        [label]="'Start date'"
        [type]="'date'"
        [modelValue]="startDateValue"
        (onGetValue)="onStartDateInput($event)"
      />
    </div>
    <div class="sprint-form-group">
      <app-input
        [label]="'End date'"
        [type]="'date'"
        [modelValue]="endDateValue"
        (onGetValue)="onEndDateInput($event)"
      />
    </div>
    <p class="sprint-error" *ngIf="formError()">{{ formError() }}</p>
  </div>

  <div class="sprint-modal-footer">
    <div
      *ngIf="isEditMode"
      class="sprint-btn sprint-btn--danger"
      (click)="onDelete()"
    >
      Delete
    </div>
    <div class="sprint-footer-right">
      <div class="sprint-btn sprint-btn--secondary" (click)="onClose()">Cancel</div>
      <div
        class="sprint-btn sprint-btn--primary"
        [class.is-disabled]="isSaving()"
        (click)="onSave()"
      >
        {{ isEditMode ? 'Save' : 'Create' }}
      </div>
    </div>
  </div>
</div>
