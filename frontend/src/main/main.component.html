<div class="content">
  <aside>
    <div class="sidebar">
      <app-workspace-sidebar
        (selectBoard)="onSelectBoard($event)"
        (openInvite)="store.onOpenInviteModal()"
        (openSettings)="store.onOpenWorkspaceSettings()"
        (openCreate)="store.onOpenCreateModal()"
        (addBoard)="store.onAddBoard()"
      />
    </div>
  </aside>

  <ng-container *ngIf="(store.boards?.length ?? 0) > 0; else noBoards">
    <div class="main-container">
      <header class="header">
        <app-board-header
          [selectedToolbarTab]="selectedToolbarTab"
          (toolbarTabSelect)="onToolbarTabSelect($event)"
          (searchChange)="store.onSearchChange($event)"
          (addSprint)="store.onAddSprint()"
          (inviteBoard)="store.onOpenBoardInviteModal()"
          (addTask)="taskSession.onAddTask()"
          (userSelect)="store.onUserSelect($event)"
        />
      </header>
      <div class="main">
        <div [ngSwitch]="selectedToolbarTab()">
          <ng-container *ngSwitchCase="'Chat'">
            <app-chat />
          </ng-container>
          <ng-container *ngSwitchCase="'Board'">
            <app-kanban-board />
          </ng-container>
          <ng-container *ngSwitchCase="'Backlog'">
            <app-backlog-view />
          </ng-container>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-template #noBoards>
    <div class="main-empty-state">No boards</div>
  </ng-template>
</div>
